name: PR

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      - run: cargo build --release

      - run: cargo build --target wasm32-wasip1 --release

      - name: Install wasmtime
        run: |
          WASMTIME_VER="26.0.0"
          curl -fL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VER}/wasmtime-v${WASMTIME_VER}-x86_64-linux.tar.xz" \
            -o /tmp/wasmtime.tar.xz
          mkdir -p /tmp/wasmtime
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp/wasmtime --strip-components=1
          echo "/tmp/wasmtime" >> "$GITHUB_PATH"

      - name: WASI smoke test
        run: |
          wasmtime run --dir . \
            target/wasm32-wasip1/release/exceltocsv.wasm \
            tests/fixtures/simple.xlsx > /tmp/wasi_out.csv
          diff /tmp/wasi_out.csv tests/expected/simple.csv
