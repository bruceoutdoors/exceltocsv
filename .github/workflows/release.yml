name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: stable
          targets: wasm32-wasip1, x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: rust

      - run: cargo test --locked

      - run: cargo build --locked --target x86_64-unknown-linux-musl --release

      - run: cargo build --locked --target wasm32-wasip1 --release

      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.254.0 --locked

      - name: Strip WASM debug symbols
        run: wasm-tools strip target/wasm32-wasip1/release/exceltocsv.wasm -o exceltocsv.wasm

      - uses: bytecodealliance/actions/wasmtime/setup@7ee36389ead2e51422087f820a7e17e39811b05f
        with:
          version: "26.0.0"

      - name: WASI smoke test
        run: |
          wasmtime run exceltocsv.wasm < tests/fixtures/simple.xlsx > output.csv
          cmp output.csv tests/expected/simple.csv

      - name: Package artifacts
        run: |
          cp target/x86_64-unknown-linux-musl/release/exceltocsv exceltocsv-linux-amd64
          sha256sum exceltocsv-linux-amd64 > exceltocsv-linux-amd64.sha256
          sha256sum exceltocsv.wasm > exceltocsv.wasm.sha256

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            exceltocsv-linux-amd64
            exceltocsv-linux-amd64.sha256
            exceltocsv.wasm
            exceltocsv.wasm.sha256
